name: Github Actions workflow to deploy "terraform/**"

on: 
    workflow_dispatch:              # allows the job to be manually triggered
    push:                            
        branches: [main]            # This action is triggered if there is a push to main
        paths: ["terraform/**"]     # specifically in the terraform directory
    
    pull_request:                   # also trigerred by pull requests
        branches: [main]
        paths: ["terraform/**"]

jobs:
    plan:
        name: Terraform plan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS IAM Role
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::923377182840:role/GithubActions-Terraform-Learning
                aws-region: us-east-1

            - name: Initialize project and view Terraform Plan
              run: |
                cd terraform
                terraform fmt
                terraform init
                terraform plan

    deploy:
        name: Terraform deploy
        needs: plan
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Configure AWS IAM Role
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::923377182840:role/GithubActions-Terraform-Learning
                aws-region: us-east-1
            - name: Initialize poject and deploy terraform
              run: |
                cd terraform
                terraform fmt
                terraform init
                terraform apply --auto-approve=true